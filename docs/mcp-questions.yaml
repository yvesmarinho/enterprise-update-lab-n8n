mcp_questions:
  discovery:
    - id: "Q01"
      question: "Qual versao exata do n8n esta em execucao no ambiente wfdb01?"
      rationale: "Confirmar baseline antes do upgrade"
      expected_answer_type: "string"
      default: "2.6.4"

    - id: "Q02"
      question: "Qual estrategia de update de container sera adotada (in-place, blue-green, canary) mantendo upgrade versao a versao?"
      rationale: "Definir risco, plano de rollback e trilha de versoes intermediarias"
      expected_answer_type: "enum"
      options: ["in-place", "blue-green", "canary"]

    - id: "Q03"
      question: "Quais workflows sao criticos para validacao obrigatoria pos-upgrade?"
      rationale: "Definir cobertura minima de testes"
      expected_answer_type: "list"

  compatibility:
    - id: "Q04"
      question: "Quais dependencias externas devem ser validadas (DB, filas, webhooks, credenciais)?"
      rationale: "Evitar regressao de integracao"
      expected_answer_type: "list"

    - id: "Q05"
      question: "Existe mudanca de variaveis de ambiente entre a versao atual e a alvo?"
      rationale: "Prevenir falha de startup"
      expected_answer_type: "boolean"

    - id: "Q06"
      question: "Quais limites de desempenho sao aceitaveis apos o upgrade?"
      rationale: "Estabelecer criterio objetivo de aceite"
      expected_answer_type: "map"

  operations:
    - id: "Q07"
      question: "Qual janela de manutencao aprovada para execucao do upgrade?"
      rationale: "Alinhar operacao com disponibilidade do servico"
      expected_answer_type: "string"

    - id: "Q08"
      question: "Qual procedimento de backup e restore sera usado antes da mudanca?"
      rationale: "Garantir recuperacao em caso de falha"
      expected_answer_type: "text"

    - id: "Q09"
      question: "Quais evidencias devem ser anexadas para aprovar a release?"
      rationale: "Padronizar auditoria e compliance"
      expected_answer_type: "list"

  governance:
    - id: "Q10"
      question: "Qual responsavel aprova cada gate (constitution, plan, tasks, implement)?"
      rationale: "Definir accountability por etapa"
      expected_answer_type: "map"

    - id: "Q11"
      question: "Qual estrategia de rastreabilidade sera usada entre spec, tarefas e execucao?"
      rationale: "Suportar SDD e auditoria"
      expected_answer_type: "text"

    - id: "Q12"
      question: "Quais riscos bloqueadores impedem promover para producao?"
      rationale: "Definir criterios de no-go"
      expected_answer_type: "list"

rules:
  - "Seguir o fluxo de trabalho do framework Speckit"
  - "Criar fluxo de atualizacao de container do n8n evitando erros de compatibilidade e desempenho"
  - "Atualizacao do n8n deve ocorrer versao a versao desde 2.6.4 ate latest, sem pular versoes"
  - "Fluxo de trabalho deve ser guiado por prompts para GitHub Copilot"
  - "Configuracao MCP deve ser gerada automaticamente baseada nas especificacoes"
  - "Sistema de versionamento e historico deve rastrear todas as mudancas"
  - "Ambiente de teste esta publicado no servidor wfdb01 na pasta /opt/docker_user/n8n"
  - "Atencao a configuracao de conexao SSH SPA contidos em .secrets/ssh.json"

output_contract:
  expected_outputs:
    - "Documentacao em Markdown com historico de acoes"
    - "Artefatos para automacao em Python e Ansible"
    - "Roteiro de compatibilidade e desempenho para update do n8n"
  quality_requirements:
    - "Documentacao incremental"
    - "Rastreabilidade ponta a ponta"
    - "Rollback testavel"
    - "Validacao funcional e nao funcional"
