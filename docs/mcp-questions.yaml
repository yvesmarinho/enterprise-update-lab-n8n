# Configuracao MCP para projeto de update do n8n
# Gerado a partir de docs/objetivo.yaml e do modelo de mcp-questions

metadata:
  project_name: "enterprise-update-lab-n8n"
  project_type: "infrastructure"
  domain: "devops"
  primary_language: "python"
  automation_languages:
    - "python"
    - "ansible"
  template_type: "enterprise"
  generated_from:
    - "docs/objetivo.yaml"
    - "docs/mcp-questions.yaml (estrutura-modelo anterior)"
  generated_on: "2026-03-23"

project_context:
  description: "Projeto para atualizar o n8n da versao 2.6.4 ate a ultima disponivel, analisando compatibilidade e desempenho. A execucao deve ocorrer versao a versao, sem salto."
  source_version: "2.6.4"
  target_version: "latest"
  latest_resolution:
    source_precedence:
      - "official_n8n_release_tags"
      - "official_n8n_release_notes_fallback"
    resolved_target_frozen_per_round: true
    required_evidence:
      - "source_url"
      - "resolved_timestamp"
      - "resolved_version"
  upgrade_policy: "sequential_version_by_version"
  skip_versions_allowed: false
  response_expected: "Documentos e codigos Python e Ansible para automatizar o update do n8n com analise de compatibilidade e desempenho."
  workflow_reference: "objetivo.yaml -> Copilot -> mcp-questions.yaml -> MCP automatico"
  test_environment:
    host: "wfdb01"
    path: "/opt/docker_user/n8n"
    ssh_config_reference: ".secrets/ssh.json"

workflow:
  framework: "Speckit"
  execution_flow:
    - "constitution"
    - "plan"
    - "tasks"
    - "implement"
  stage_gates:
    - stage: "constitution"
      acceptance: "Principios, regras e limites de seguranca definidos"
    - stage: "plan"
      acceptance: "Plano de upgrade com trilha versao a versao, riscos, rollback e metricas"
    - stage: "tasks"
      acceptance: "Tarefas ordenadas por dependencia e criticidade"
    - stage: "implement"
      acceptance: "Execucao com evidencias, validacao e rastreabilidade"

folder_structure:
  - ".vscode - Configuracoes VS Code e MCP (geradas automaticamente)"
  - ".github - Workflows de GitHub Actions para automacao de CI/CD e AI agents"
  - "src - Codigo-fonte do projeto (estrutura especifica por tipo)"
  - ".specify - Speckit framework configuration e templates"
  - "test - Testes automatizados (framework baseado na linguagem)"
  - "docs - Documentacao (gerada automaticamente)"
  - "pattern_code - Templates e padroes de codigo reutilizaveis"
  - "scripts - Scripts de automacao inteligente"
  - "objetivo.yaml - Especificacao detalhada do projeto"
  - "mcp-questions.yaml - Configuracao gerada pelo Copilot"

profiles:
  - role: "system_architect"
    skill_level: "expert"
    description: "Arquiteto em solucoes Docker com Linux Debian 12."
    focus:
      - "Estrategia de upgrade entre versoes do n8n (2.6.4 -> latest) com execucao versao a versao"
      - "Compatibilidade entre imagem, volumes, banco e variaveis de ambiente"
      - "Definicao de gates tecnicos para promocao entre ambientes"
    responsibilities:
      - "Definir arquitetura de atualizacao com rollback seguro"
      - "Aprovar sequencia de execucao por etapas do workflow Speckit"
      - "Definir criterios de risco e janela de manutencao"
    decision_criteria:
      - "Priorizar disponibilidade e integridade de dados"
      - "Evitar mudancas nao reversiveis sem backup validado"

  - role: "n8n_specialist"
    skill_level: "expert"
    description: "Especialista em n8n e automacao de workflows."
    focus:
      - "Quebras de compatibilidade entre versoes do n8n"
      - "Impacto em nodes, credenciais, executions e filas"
      - "Validacao funcional de workflows criticos"
    responsibilities:
      - "Mapear riscos por versao e notas de release"
      - "Definir checklist de validacao pos-upgrade"
      - "Validar comportamento de workflows em ambiente de teste"
    decision_criteria:
      - "Zero perda de execucoes e credenciais"
      - "Sem regressao funcional nos fluxos criticos"

  - role: "devops_engineer"
    skill_level: "expert"
    description: "Expert em Python, Ansible e SDD (Specification-Driven Development)."
    focus:
      - "Automacao idempotente de atualizacao"
      - "Padronizacao de scripts e playbooks"
      - "Implementacao orientada por especificacao (SDD)"
      - "Coleta de evidencias tecnicas e logs de execucao"
    responsibilities:
      - "Especificar automacoes de pre-check, upgrade e pos-check"
      - "Padronizar variaveis de ambiente e parametros de execucao"
      - "Garantir rastreabilidade entre especificacao e execucao"
      - "Garantir reprodutibilidade do processo em multiplos ambientes"
    decision_criteria:
      - "Execucao nao interativa e auditavel"
      - "Conformidade com requisitos definidos na especificacao"
      - "Falhas tratadas com retorno e acao de recuperacao"

  - role: "devops_automation"
    skill_level: "advanced"
    description: "Especialista em DevOps, automacao de workflows de desenvolvimento e SDD."
    focus:
      - "Orquestracao do fluxo objetivo.yaml -> mcp-questions.yaml -> MCP"
      - "Governanca de documentacao e versionamento"
      - "Adocao de SDD para padronizar decisoes tecnicas"
      - "Padronizacao dos prompts e artefatos de sessao"
    responsibilities:
      - "Garantir consistencia entre especificacao, plano e tarefas"
      - "Rastrear mudancas e dependencias entre artefatos"
      - "Assegurar que execucao siga os criterios definidos em spec"
      - "Definir criterios de completude de cada etapa"
    decision_criteria:
      - "Rastreabilidade ponta a ponta das decisoes"
      - "Priorizar entregas aderentes ao ciclo SDD"
      - "Documentacao incremental e verificavel"

  - role: "project_manager"
    skill_level: "advanced"
    description: "Gestor de projetos com foco em governanca, planejamento e entrega incremental."
    focus:
      - "Planejamento de marcos e cronograma do upgrade"
      - "Gestao de riscos, comunicacao e alinhamento entre perfis"
      - "Acompanhamento de progresso por criterios de aceite"
    responsibilities:
      - "Definir plano de execucao e priorizacao por impacto"
      - "Gerenciar dependencias, impedimentos e decisoes"
      - "Garantir visibilidade de status para stakeholders"
    decision_criteria:
      - "Maximizar previsibilidade de entrega"
      - "Reduzir risco operacional durante a janela de mudanca"

  - role: "test_engineer"
    skill_level: "expert"
    description: "Engenheiro de testes para validacao funcional, regressao e desempenho da atualizacao."
    focus:
      - "Estrategia de testes pre e pos-upgrade"
      - "Cobertura de cenarios criticos e regressao"
      - "Metricas de desempenho e estabilidade"
    responsibilities:
      - "Definir matriz de testes por risco e criticidade"
      - "Executar validacoes funcionais e de compatibilidade"
      - "Consolidar evidencias de teste para aprovacao de release"
    decision_criteria:
      - "Sem regressos criticos em workflows prioritarios"
      - "Desempenho e estabilidade dentro de limites aceitaveis"

